<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fortress Command</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#141A38;font-family:'Courier New',monospace;}
#canvas{display:block;touch-action:none;cursor:default;user-select:none;-webkit-user-select:none;image-rendering:pixelated;image-rendering:crisp-edges;}
#minimap-canvas{display:block;position:fixed;bottom:8px;right:8px;width:180px;height:40px;background:rgba(26,26,38,0.8);border:1px solid #3380FF;border-radius:4px;z-index:10;cursor:pointer;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;height:80px;background:rgba(26,26,38,0.9);display:flex;align-items:center;padding:0 20px;gap:20px;color:#fff;font-size:14px;z-index:10;pointer-events:none;transition:padding-left 0.15s;}
#hud.menu-open{padding-left:280px;}
#hud-left{display:flex;flex-direction:column;gap:2px;min-width:100px;}
#hud-center{flex:1;text-align:center;}
#hud-right{text-align:right;min-width:80px;}
.credit-val{color:#3380FF;font-weight:bold;font-size:18px;}
.income-val{color:#00FF66;font-size:12px;}
#sel-info{color:#aaa;font-size:13px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#mode-label{color:#666;font-size:12px;}

/* Build tab */
#build-tab{position:fixed;top:50%;left:0;transform:translateY(-50%);width:32px;height:80px;background:rgba(26,26,38,0.9);color:#fff;border-radius:0 8px 8px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;font-size:18px;user-select:none;border:1px solid #3380FF;border-left:none;}
#build-tab:active{background:#3380FF;}

/* Build menu */
#build-menu{position:fixed;top:0;left:-260px;width:260px;height:100%;background:rgba(26,26,38,0.97);color:#fff;z-index:15;transition:left 0.15s;padding:16px 12px;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,0.5);}
#build-menu.open{left:0;}
.menu-section-title{font-size:10px;color:#557;color:#558;letter-spacing:2px;text-transform:uppercase;margin:14px 0 6px 4px;}
.menu-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;}
.menu-item:hover{background:rgba(51,128,255,0.2);border-color:#3380FF;}
.menu-item.disabled{opacity:0.35;pointer-events:none;cursor:default;}
.menu-item.disabled:hover{background:transparent;border-color:transparent;}
.menu-icon{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.menu-name{flex:1;font-size:13px;}
.menu-cost{color:#3380FF;font-size:12px;}
.menu-time{color:#555;font-size:11px;}

#train-section{margin-top:8px;}
.train-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:background 0.1s;}
.train-item:hover{background:rgba(51,128,255,0.2);}
.train-item.disabled{opacity:0.35;pointer-events:none;}
.train-item.queued{background:rgba(0,255,102,0.25);border-color:#00FF66;}

#menu-close{position:absolute;top:12px;right:12px;font-size:18px;color:#557;cursor:pointer;padding:4px 8px;}
#menu-close:hover{color:#fff;}

/* Menu screen */
#menu-screen{position:fixed;inset:0;background:linear-gradient(180deg,#0d1020 0%,#1a2540 50%,#141A38 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#menu-screen.hidden{display:none;}
.game-title{font-size:clamp(22px,6vw,52px);font-weight:bold;color:#fff;letter-spacing:6px;margin-bottom:6px;text-align:center;text-shadow:0 0 30px rgba(51,128,255,0.4);}
.game-subtitle{font-size:clamp(10px,2.5vw,13px);color:#446;margin-bottom:16px;letter-spacing:2px;}
.game-version{font-size:clamp(10px,2vw,12px);color:#3355aa;margin-bottom:36px;letter-spacing:2px;font-family:'Courier New',monospace;}
.mode-btn{padding:14px 48px;margin:8px;border:2px solid #3380FF;background:transparent;color:#fff;font-family:'Courier New',monospace;font-size:clamp(13px,2.5vw,16px);border-radius:8px;cursor:pointer;min-width:220px;transition:background 0.1s;}
.mode-btn:hover{background:#3380FF;}
.mode-btn:active{background:#1a5ebe;}

/* Game over overlay */
#gameover-screen{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#gameover-screen.hidden{display:none;}
.go-title{font-size:clamp(28px,8vw,64px);font-weight:bold;margin-bottom:30px;text-align:center;}
.go-title.victory{color:#00FF66;text-shadow:0 0 30px rgba(0,255,102,0.4);}
.go-title.defeat{color:#FF4D4D;text-shadow:0 0 30px rgba(255,77,77,0.4);}
.go-btn{padding:14px 48px;margin:8px;border:2px solid #3380FF;background:transparent;color:#fff;font-family:'Courier New',monospace;font-size:16px;border-radius:8px;cursor:pointer;min-width:180px;}
.go-btn:hover{background:#3380FF;}

/* Build preview ghost */
#preview-canvas{position:fixed;inset:0;pointer-events:none;z-index:5;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<canvas id="minimap-canvas"></canvas>
<canvas id="preview-canvas"></canvas>

<div id="hud">
  <div id="hud-left">
    <span class="credit-val" id="hud-credits">💰 300</span>
    <span class="income-val" id="hud-income">+5/s</span>
  </div>
  <div id="hud-center"><span id="sel-info">TAP A UNIT OR BUILDING</span></div>
  <div id="hud-right"><span id="mode-label">—</span></div>
</div>

<div id="build-tab">▸</div>
<div id="build-menu">
  <div id="menu-close">✕</div>
  <div class="menu-section-title">Structures</div>
  <div id="build-list"></div>
  <div id="train-section" style="display:none">
    <div class="menu-section-title">Train Units</div>
    <div id="train-list"></div>
  </div>
</div>

<div id="menu-screen">
  <div class="game-title">FORTRESS COMMAND</div>
  <div class="game-subtitle">PLATFORMER / RTS CROSSOVER</div>
  <div class="game-version">v<span id="game-version-num"></span></div>
  <button class="mode-btn" data-mode="1v1_cpu">1 vs CPU</button>
  <button class="mode-btn" data-mode="1v1_local">1 vs 1 Local</button>
  <button class="mode-btn" data-mode="ffa_3">Free-for-All (3)</button>
  <button class="mode-btn" data-mode="ffa_4">Free-for-All (4)</button>
  <button class="mode-btn" data-mode="ctf_1v1_cpu" style="border-color:#FFCC00;color:#FFCC00;">Capture the Flag</button>
</div>

<div id="gameover-screen" class="hidden">
  <div class="go-title" id="go-title">VICTORY</div>
  <button class="go-btn" id="go-restart">RESTART</button>
  <button class="go-btn" id="go-menu">MENU</button>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// SECTION 2: CONFIG
// ═══════════════════════════════════════════════════════════════
const TILE_SIZE = 32;
const MAP_WIDTH_TILES = 200;
const MAP_HEIGHT_TILES = 20;
const GROUND_LEVEL_TILE = 3;
const GAME_VERSION = '0.1.3';
const PLATFORM_ROWS = [3, 7, 11]; // tiles ABOVE ground surface;
const PLATFORM_MIN_LEN = 4;
const PLATFORM_MAX_LEN = 12;

// Colors [r,g,b] 0–1
const C = {
  BG:            [0.12, 0.14, 0.20],
  SKY_TOP:       [0.08, 0.10, 0.22],
  SKY_BOT:       [0.18, 0.22, 0.30],
  GROUND:        [0.30, 0.25, 0.18],
  PLATFORM:      [0.35, 0.32, 0.25],
  BRIDGE:        [0.45, 0.30, 0.15],
  // UI
  HUD_BG:        'rgba(26,26,38,0.9)',
  ACCENT:        '#3380FF',
  SELECT:        '#00FF66',
  TEXT:          '#ffffff',
  DIM:           '#556677',
  // Player colors [r,g,b]
  PLAYER: [
    [0.2,  0.6,  1.0],  // blue
    [1.0,  0.3,  0.3],  // red
    [0.3,  0.9,  0.3],  // green
    [1.0,  0.8,  0.2],  // yellow
  ],
};

// Physics
const GRAVITY = 900;
const TERMINAL_VELOCITY = 600;
const JUMP_VELOCITY = -360;

// Camera
const CAMERA_SCROLL_SPEED = 400;
const CAMERA_EDGE_MARGIN = 80;
const CAMERA_LERP = 0.08;

// Economy
const STARTING_CREDITS = 300;
const CREDIT_TICK_INTERVAL = 1.0;
const BASE_INCOME = 5;

// UI dimensions
const HUD_HEIGHT = 80;
const MINIMAP_W = 180;
const MINIMAP_H = 40;
const BUILD_MENU_W = 260;

// Unit types
const UNIT_TYPES = {
  soldier: {
    hp:30, speed:80, damage:8, attack_range:40, attack_rate:0.8,
    cost:50, train_time:3.0, width:12, height:20,
    can_build:false, can_repair:false, repair_rate:0,
  },
  heavy: {
    hp:80, speed:45, damage:20, attack_range:35, attack_rate:1.5,
    cost:120, train_time:6.0, width:16, height:22,
    can_build:false, can_repair:false, repair_rate:0,
  },
  scout: {
    hp:15, speed:140, damage:5, attack_range:30, attack_rate:0.4,
    cost:30, train_time:1.5, width:10, height:18,
    can_build:false, can_repair:false, repair_rate:0,
  },
  engineer: {
    hp:20, speed:70, damage:3, attack_range:25, attack_rate:1.0,
    cost:60, train_time:4.0, width:12, height:20,
    can_build:true, can_repair:true, repair_rate:5,
  },
};

// Building types
const BUILDING_TYPES = {
  hq: {
    hp:500, width_tiles:4, height_tiles:3, cost:0, build_time:0,
    provides_income:true, income_amount:5,
    blocksUnits:false,
  },
  barracks: {
    hp:200, width_tiles:3, height_tiles:2, cost:150, build_time:5.0,
    can_train:['soldier','heavy','scout'],
  },
  turret: {
    hp:120, width_tiles:2, height_tiles:2, cost:100, build_time:4.0,
    auto_attack:true, attack_damage:12, attack_range:150, attack_rate:1.2,
  },
  wall: {
    hp:300, width_tiles:1, height_tiles:2, cost:40, build_time:2.0,
    blocksUnits:true,
  },
  mine: {
    hp:100, width_tiles:2, height_tiles:2, cost:200, build_time:8.0,
    blocksUnits:false,
    provides_income:true, income_amount:15,
  },
  workshop: {
    hp:180, width_tiles:3, height_tiles:2, cost:200, build_time:6.0,
    can_train:['engineer'],
  },
  bridge: {
    hp:150, width_tiles:1, height_tiles:1,
    cost_per_tile:15, cost:15, build_time:3.0, is_bridge:true,
  },
};

// Projectile
const PROJECTILE_SPEED = 350;
const PROJECTILE_RADIUS = 3;
const MINE_DAMAGE = 80;

// AI
const AI_THINK_INTERVAL = 2.0;
const AI_AGGRESSION_RAMP = 0.01;

// Tile constants (match Python original)
const TILE_EMPTY = 0;
const TILE_GROUND = 1;
const TILE_PLATFORM = 2;
const TILE_BRIDGE = 3;

// ═══════════════════════════════════════════════════════════════
// SECTION 3: UTILITY
// ═══════════════════════════════════════════════════════════════
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

function rgb(c) {
  if (typeof c === 'string') return c;
  return `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
}
function rgba(c, a) {
  return `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`;
}

function floor(n) { return Math.floor(n); }

// ═══════════════════════════════════════════════════════════════
// SECTION 4: TILEMAP
// ═══════════════════════════════════════════════════════════════
class TileMap {
  constructor(width = MAP_WIDTH_TILES, height = MAP_HEIGHT_TILES) {
    this.width = width;
    this.height = height;
    this.tiles = Array.from({length: width}, () => Array(height).fill(TILE_EMPTY));
    // Tracks tiles occupied by buildings: Map "tx,ty" -> buildingId
    this._buildingTiles = new Map();
    // Separate map for tiles that block unit movement (only walls/mines)
    this._unitBlockingTiles = new Map();
  }

  generate() {
    // Ground at the BOTTOM of the map (y increases downward in screen coords)
    const groundTop = this.height - GROUND_LEVEL_TILE;
    for (let x = 0; x < this.width; x++) {
      for (let y = groundTop; y < this.height; y++) {
        this.tiles[x][y] = TILE_GROUND;
      }
    }
    // Platforms float above ground level (tiles below groundTop)
    // row_y here is tiles above the ground surface, not absolute tile coords
    for (const rowDelta of PLATFORM_ROWS) {
      const row_y = groundTop - rowDelta - 1;
      if (row_y < 1 || row_y >= this.height - 1) continue;
      let x = 3 + floor(Math.random() * 8);
      while (x < this.width - 5) {
        const length = PLATFORM_MIN_LEN + floor(Math.random() * (PLATFORM_MAX_LEN - PLATFORM_MIN_LEN + 1));
        for (let px = x; px < Math.min(x + length, this.width); px++) {
          this.tiles[px][row_y] = TILE_PLATFORM;
        }
        const gap = 3 + floor(Math.random() * 6);
        x += length + gap;
      }
    }
    // Clear starting areas for HQs (just above ground surface)
    this._clearArea(2, groundTop, 6, 5);
    this._clearArea(this.width - 8, groundTop, 6, 5);
  }

  _clearArea(x, y, w, h) {
    for (let tx = Math.max(0, x); tx < Math.min(x + w, this.width); tx++) {
      for (let ty = Math.max(0, y); ty < Math.min(y + h, this.height); ty++) {
        if (this.tiles[tx][ty] === TILE_PLATFORM) this.tiles[tx][ty] = TILE_EMPTY;
      }
    }
  }

  getTile(x, y) {
    if (x < 0 || x >= this.width || y < 0 || y >= this.height) {
      return TILE_EMPTY; // treat out-of-bounds as empty (no infinite ground)
    }
    return this.tiles[x][y];
  }

  // Returns the tile y coordinate of the ground surface (first ground tile from bottom)
  groundSurfaceTileY() {
    return this.height - GROUND_LEVEL_TILE;
  }

  // Mark tiles as occupied by a building (so units can't fall through)
  markBuildingTiles(tileX, tileY, w, h, buildingId, buildingType) {
    for (let tx = tileX; tx < tileX + w; tx++) {
      for (let ty = tileY; ty < tileY + h; ty++) {
        this._buildingTiles.set(`${tx},${ty}`, buildingId);
        // Only register in unit-blocking map if this building type blocks units
        if (BUILDING_TYPES[buildingType]?.blocksUnits) {
          this._unitBlockingTiles.set(`${tx},${ty}`, buildingId);
        }
      }
    }
  }

  // Clear tiles when a building is destroyed or removed
  clearBuildingTiles(tileX, tileY, w, h) {
    for (let tx = tileX; tx < tileX + w; tx++) {
      for (let ty = tileY; ty < tileY + h; ty++) {
        this._buildingTiles.delete(`${tx},${ty}`);
        this._unitBlockingTiles.delete(`${tx},${ty}`);
      }
    }
  }

  isSolid(x, y) {
    // Out of bounds = solid (boundary wall)
    if (y < 0 || y >= this.height) return true;
    if (x < 0 || x >= this.width) return true;
    // Only unit-blocking buildings (walls, mines) act as solid for unit physics
    if (this._unitBlockingTiles.has(`${x},${y}`)) return true;
    return this.tiles[x][y] !== TILE_EMPTY;
  }

  worldToTile(wx, wy) {
    return { tx: floor(wx / TILE_SIZE), ty: floor(wy / TILE_SIZE) };
  }

  tileToWorld(tx, ty) {
    return { x: tx * TILE_SIZE, y: ty * TILE_SIZE };
  }

  getGroundY(worldX) {
    const { tx } = this.worldToTile(worldX);
    // Surface = topmost solid tile (first hit scanning top-to-bottom)
    for (let ty = 0; ty < this.height; ty++) {
      if (this.isSolid(tx, ty)) return ty * TILE_SIZE;
    }
    return (this.height - GROUND_LEVEL_TILE) * TILE_SIZE;
  }

  rectCollides(left, bottom, width, height) {
    const tx1 = floor(left / TILE_SIZE);
    const tx2 = floor((left + width - 1) / TILE_SIZE);
    const ty1 = floor(bottom / TILE_SIZE);
    const ty2 = floor((bottom + height - 1) / TILE_SIZE);
    for (let tx = Math.max(0, tx1); tx <= Math.min(tx2, this.width - 1); tx++) {
      for (let ty = Math.max(0, ty1); ty <= Math.min(ty2, this.height - 1); ty++) {
        if (this.tiles[tx][ty] !== TILE_EMPTY) return true;
      }
    }
    return false;
  }

  canPlaceBuilding(tileX, tileY, w, h) {
    const gsY = this.groundSurfaceTileY();
    // A building sits on ground when its bottom edge is at gsY (ground surface row)
    const sitsOnGround = (tileY + h - 1 === gsY - 1);
    // All footprint tiles must be empty, EXCEPT ground tiles are allowed
    // when the building sits on the ground surface (ground forms a solid base below)
    for (let tx = tileX; tx < tileX + w; tx++) {
      for (let ty = tileY; ty < tileY + h; ty++) {
        const tile = this.getTile(tx, ty);
        const hasBuilding = this._buildingTiles.has(`${tx},${ty}`);
        if (tile !== TILE_EMPTY && !(sitsOnGround && tile === TILE_GROUND) && !hasBuilding) {
          return false;
        }
      }
    }
    // Must have solid ground directly below the building's bottom edge
    const bottomTy = tileY + h - 1;
    for (let tx = tileX; tx < tileX + w; tx++) {
      if (!this.isSolid(tx, bottomTy + 1)) return false;
    }
    return true;
  }
  findBridgeSpan(tileX, tileY) {
    if (this.isSolid(tileX, tileY)) return null;
    // Scan left for solid anchor
    let left = tileX;
    while (left > 0 && !this.isSolid(left - 1, tileY)) left--;
    if (left <= 0 || !this.isSolid(left - 1, tileY)) return null;
    // Scan right for solid anchor
    let right = tileX;
    while (right < this.width - 1 && !this.isSolid(right + 1, tileY)) right++;
    if (right >= this.width - 1 || !this.isSolid(right + 1, tileY)) return null;
    const spanW = right - left + 1;
    if (spanW < 1 || spanW > 12) return null;
    return { start: left, width: spanW };
  }

  setBridgeTiles(tileX, tileY, w) {
    for (let tx = tileX; tx < tileX + w; tx++) {
      if (tx >= 0 && tx < this.width && tileY >= 0 && tileY < this.height) {
        this.tiles[tx][tileY] = TILE_BRIDGE;
      }
    }
  }

  clearBridgeTiles(tileX, tileY, w) {
    for (let tx = tileX; tx < tileX + w; tx++) {
      if (tx >= 0 && tx < this.width && tileY >= 0 && tileY < this.height) {
        if (this.tiles[tx][tileY] === TILE_BRIDGE) this.tiles[tx][tileY] = TILE_EMPTY;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 5: CAMERA
// ═══════════════════════════════════════════════════════════════
class Camera {
  constructor(viewW, viewH) {
    this.viewW = viewW;
    this.viewH = viewH;
    this.x = 0;
    this.y = 0;
    this.targetX = 0;
    this.worldW = MAP_WIDTH_TILES * TILE_SIZE;
    this.worldH = MAP_HEIGHT_TILES * TILE_SIZE;
  }

  focusOn(worldX) {
    this.targetX = worldX - this.viewW / 2;
  }

  update(dt) {
    this.x = lerp(this.x, this.targetX, CAMERA_LERP);
    this.x = clamp(this.x, 0, this.worldW - this.viewW);
    this.y = 0;
  }

  worldToScreen(wx, wy) {
    return { sx: wx - this.x, sy: wy - this.y };
  }

  screenToWorld(sx, sy) {
    return { wx: sx + this.x, wy: sy + this.y };
  }

  visibleRect() {
    return { left: this.x, right: this.x + this.viewW, top: this.y, bottom: this.y + this.viewH };
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 6: UNIT
// ═══════════════════════════════════════════════════════════════
let _nextUnitId = 0;

class Unit {
  constructor(unitType, x, y, ownerId) {
    const cfg = UNIT_TYPES[unitType];
    this.id = _nextUnitId++;
    this.type = unitType;
    this.ownerId = ownerId;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.onGround = false;

    this.maxHp = cfg.hp;
    this.hp = this.maxHp;
    this.speed = cfg.speed;
    this.damage = cfg.damage;
    this.attackRange = cfg.attack_range;
    this.attackRate = cfg.attack_rate;
    this.width = cfg.width;
    this.height = cfg.height;
    this.canBuild = cfg.can_build;
    this.canRepair = cfg.can_repair;
    this.repairRate = cfg.repair_rate;

    this.alive = true;
    this.attackTimer = 0;
    this.target = null;
    this.moveTargetX = null;
    this.facing = 1;
    this.selected = false;
    this.state = 'idle';
    this.damageFlash = 0;
    // CTF: which playerId's flag this unit is carrying (null = not carrying)
    this.flagCarrying = null;
  }

  update(dt, tilemap) {
    if (!this.alive) return;
    this.attackTimer = Math.max(0, this.attackTimer - dt);
    this.damageFlash = Math.max(0, this.damageFlash - dt);
    this._updateMovement(dt);
    this._applyPhysics(dt, tilemap);
  }

  _updateMovement(dt) {
    let targetX = this.moveTargetX;
    if (this.target && this.target.alive && typeof this.target.x === 'number') {
      targetX = this.target.x;
      const dist = Math.abs(this.target.x - this.x);
      if (dist <= this.attackRange) {
        this.state = 'attacking';
        this.facing = this.target.x > this.x ? 1 : -1;
      } else {
        this.state = 'moving';
      }
    }
    if (targetX !== undefined && targetX !== null) {
      const dx = targetX - this.x;
      if (Math.abs(dx) > 4) {
        this.vx = this.speed * (dx > 0 ? 1 : -1);
        this.facing = dx > 0 ? 1 : -1;
        if (this.state !== 'attacking') this.state = 'moving';
      } else {
        this.vx = 0;
        if (!this.target) {
          this.moveTargetX = null;
          this.state = 'idle';
        }
      }
    } else {
      this.vx = 0;
      if (this.state === 'moving') this.state = 'idle';
    }
  }

  _applyPhysics(dt, tilemap) {
    // Gravity
    this.vy += GRAVITY * dt;
    if (this.vy > TERMINAL_VELOCITY) this.vy = TERMINAL_VELOCITY;

    // Horizontal
    let newX = this.x + this.vx * dt;
    const halfW = this.width / 2;
    if (this.vx < 0) {
      const { tx, ty } = tilemap.worldToTile(newX - halfW, this.y + 2);
      if (tilemap.isSolid(tx, ty)) {
        newX = (tx + 1) * TILE_SIZE + halfW;
        this.vx = 0;
      }
    } else if (this.vx > 0) {
      const { tx, ty } = tilemap.worldToTile(newX + halfW, this.y + 2);
      if (tilemap.isSolid(tx, ty)) {
        newX = tx * TILE_SIZE - halfW;
        this.vx = 0;
      }
    }
    this.x = newX;

    // Vertical — sweep from old feet to new feet to prevent tunnelling on large dt
    let newY = this.y + this.vy * dt;
    this.onGround = false;
    const txL = floor((this.x - halfW + 2) / TILE_SIZE);
    const txR = floor((this.x + halfW - 2) / TILE_SIZE);
    if (this.vy >= 0) {
      // Falling / standing: sweep downward from old feet tile to new feet tile
      const oldFeetTy = floor((this.y + this.height) / TILE_SIZE);
      const newFeetTy = floor((newY + this.height + 1) / TILE_SIZE);
      outer:
      for (let ty = oldFeetTy; ty <= newFeetTy; ty++) {
        for (let tx = txL; tx <= txR; tx++) {
          if (tilemap.isSolid(tx, ty)) {
            newY = ty * TILE_SIZE - this.height;
            this.vy = 0;
            this.onGround = true;
            break outer;
          }
        }
      }
    } else {
      // Rising: ceiling check
      const ty = floor(newY / TILE_SIZE);
      const tx = floor(this.x / TILE_SIZE);
      if (tilemap.isSolid(tx, ty)) {
        newY = ty * TILE_SIZE + TILE_SIZE;
        this.vy = 0;
      }
    }
    this.y = newY;
  }

  jump() {
    if (this.onGround) {
      this.vy = -JUMP_VELOCITY;
      this.onGround = false;
    }
  }

  canAttack() {
    return this.attackTimer <= 0 && this.alive;
  }

  performAttack() {
    this.attackTimer = this.attackRate;
  }

  takeDamage(amount) {
    this.hp -= amount;
    this.damageFlash = 0.15;
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
    return this.alive;
  }

  distanceTo(other) {
    const dx = this.x - other.x;
    const dy = this.y - other.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  get centerY() { return this.y + this.height / 2; }
  get rect() { return [this.x - this.width / 2, this.y, this.width, this.height]; }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 7: BUILDING
// ═══════════════════════════════════════════════════════════════
let _nextBuildingId = 0;

class Building {
  constructor(buildingType, tileX, tileY, ownerId, overrideWTiles = null, tilemap = null) {
    const cfg = BUILDING_TYPES[buildingType];
    this.id = _nextBuildingId++;
    this.type = buildingType;
    this.ownerId = ownerId;
    this.tileX = tileX;
    this.tileY = tileY;
    this.wTiles = overrideWTiles !== null ? overrideWTiles : cfg.width_tiles;
    this.hTiles = cfg.height_tiles;

    this.x = (tileX + this.wTiles / 2) * TILE_SIZE;
    this.y = tileY * TILE_SIZE;
    this.width = this.wTiles * TILE_SIZE;
    this.height = this.hTiles * TILE_SIZE;
    this.tilemap = tilemap;

    this.maxHp = cfg.hp;
    this.hp = this.maxHp;
    this.alive = true;
    this.built = cfg.build_time <= 0;
    this.buildProgress = this.built ? 1.0 : 0.0;
    this.buildTime = cfg.build_time;

    this.isBridge = cfg.is_bridge || false;
    this.bridgeTilesPlaced = false;

    this.providesIncome = cfg.provides_income || false;
    this.incomeAmount = cfg.income_amount || 0;
    this.canTrain = cfg.can_train || [];
    this.autoAttack = cfg.auto_attack || false;
    this.attackDamage = cfg.attack_damage || 0;
    this.attackRange = cfg.attack_range || 0;
    this.attackRate = cfg.attack_rate || 1.0;
    this.attackTimer = 0;
    this.hasExploded = false; // mines: set true when unit walks into mine

    this.trainQueue = [];
    this.trainTimer = 0;
    this.trainCurrent = null;
  }

  get centerY() { return this.y + this.height / 2; }

  update(dt) {
    if (!this.alive) return null;
    if (!this.built) {
      this.buildProgress += dt / this.buildTime;
      if (this.buildProgress >= 1.0) {
        this.buildProgress = 1.0;
        this.built = true;
      }
      return null;
    }
    if (this.attackTimer > 0) this.attackTimer -= dt;
    if (this.trainCurrent) {
      this.trainTimer -= dt;
      if (this.trainTimer <= 0) {
        const finished = this.trainCurrent;
        this.trainCurrent = null;
        this.trainTimer = 0;
        this._startNextTrain();
        return finished;
      }
    } else if (this.trainQueue.length > 0) {
      this._startNextTrain();
    }
    return null;
  }

  _startNextTrain() {
    if (this.trainQueue.length === 0) return;
    const unitType = this.trainQueue.shift();
    this.trainCurrent = unitType;
    this.trainTimer = UNIT_TYPES[unitType].train_time;
  }

  queueTrain(unitType) {
    if (!this.canTrain.includes(unitType)) return false;
    this.trainQueue.push(unitType);
    if (!this.trainCurrent) this._startNextTrain();
    return true;
  }

  canAttackNow() {
    return this.autoAttack && this.built && this.attackTimer <= 0;
  }

  performAttack() {
    this.attackTimer = this.attackRate;
  }

  takeDamage(amount) {
    this.hp -= amount;
    if (this.hp <= 0) {
      this.hp = 0;
      this.alive = false;
      // Clear this building's tiles from the tilemap so it no longer blocks units
      if (this.tilemap) {
        this.tilemap.clearBuildingTiles(this.tileX, this.tileY, this.wTiles, this.hTiles);
      }
    }
    return this.alive;
  }

  repair(amount) {
    if (this.alive && this.hp < this.maxHp) {
      this.hp = Math.min(this.maxHp, this.hp + amount);
    }
  }

  get centerX() { return this.x; }
  get centerY() { return this.y + this.height / 2; }
  get rect() { return [this.x - this.width / 2, this.y, this.width, this.height]; }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 8: PROJECTILE
// ═══════════════════════════════════════════════════════════════
let _nextProjectileId = 0;

class Projectile {
  constructor(x, y, direction, damage, ownerId, targetX = null, targetY = null) {
    this.id = _nextProjectileId++;
    this.x = x;
    this.y = y;
    this.vx = direction * PROJECTILE_SPEED;
    this.damage = damage;
    this.ownerId = ownerId;
    this.alive = true;
    this.radius = PROJECTILE_RADIUS;
    // Ballistic arc: use quadratic solution so targets at same height get
    // correct horizontal shots, not zero-vy shots that overshoot.
    // Solves: y + vy*t + 0.5*g*t² = targetY  with  vx*t = targetX - x
    if (targetX !== null && targetY !== null) {
      const distX = Math.abs(targetX - x);
      const s = direction * PROJECTILE_SPEED;
      let t, vy;
      if (distX < 1) {
        const dy = targetY - y;
        t = (PROJECTILE_SPEED + Math.sqrt(PROJECTILE_SPEED * PROJECTILE_SPEED - GRAVITY * Math.abs(dy))) / GRAVITY;
        vy = (dy - 0.5 * GRAVITY * t * t) / t;
        const spd = Math.sqrt(this.vx * this.vx + vy * vy);
        if (spd > PROJECTILE_SPEED) { vy = vy / spd * PROJECTILE_SPEED; }
      } else {
        t = distX / Math.abs(s);
        const a = 0.5 * GRAVITY * t * t;
        const bplus = targetY - y + a;
        const disc = bplus * bplus + 2 * a * (targetY - y);
        if (disc >= 0) {
          vy = (-bplus + Math.sqrt(disc)) / t;
        } else {
          vy = (targetY - y) / t - 0.5 * GRAVITY * t;
        }
      }
      this.vy = vy;
      this._angle = Math.atan2(this.vy, this.vx);
    } else if (targetY !== null) {
      this.vy = (targetY - y) * 0.5;
      this._angle = Math.atan2(this.vy, this.vx);
    } else {
      this.vy = 0;
      this._angle = direction > 0 ? 0 : Math.PI;
    }
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += GRAVITY * dt;  // gravity each frame for proper arc
    this._angle = Math.atan2(this.vy, this.vx);
    if (this.x < -500 || this.x > MAP_WIDTH_TILES * TILE_SIZE + 500) {
      this.alive = false;
    }
  }

  kill() { this.alive = false; }

  isOffscreen(worldW) {
    return this.x < -100 || this.x > worldW + 100;
  }

  distanceTo(other) {
    const dx = this.x - other.x;
    const dy = this.y - other.centerY;
    return Math.sqrt(dx * dx + dy * dy);
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 9: PLAYER (BASE)
// ═══════════════════════════════════════════════════════════════
class Player {
  constructor(playerId, startX, tilemap) {
    this.id = playerId;
    this.color = C.PLAYER[playerId % C.PLAYER.length];
    this.credits = STARTING_CREDITS;
    this.alive = true;
    this.units = [];
    this.buildings = [];
    this.startX = startX;
    this.tilemap = tilemap;
    this.game = null; // set by FortressCommand after player creation
    this.hq = this._placeHq(startX);
  }

  _placeHq(worldX) {
    const tileX = floor(worldX / TILE_SIZE);
    const gsY = this.tilemap.groundSurfaceTileY();
    const hqH = BUILDING_TYPES.hq.height_tiles;
    const tileY = gsY - hqH;
    const hq = new Building('hq', tileX, tileY, this.id, null, this.tilemap);
    this.buildings.push(hq);
    return hq;
  }

  canAfford(cost) { return this.credits >= cost; }
  spend(amount) { if (this.credits >= amount) { this.credits -= amount; return true; } return false; }
  earn(amount) { this.credits += amount; }

  build(buildingType, tileX, tileY) {
    const cfg = BUILDING_TYPES[buildingType];
    if (cfg.is_bridge) return this._buildBridge(tileX, tileY, cfg);
    const cost = cfg.cost;
    if (!this.canAfford(cost)) return null;
    const w = cfg.width_tiles, h = cfg.height_tiles;
    if (!this.tilemap.canPlaceBuilding(tileX, tileY, w, h)) return null;
    if (!this.spend(cost)) return null;
    const b = new Building(buildingType, tileX, tileY, this.id, null, this.tilemap);
    this.buildings.push(b);
    this.tilemap.markBuildingTiles(tileX, tileY, w, h, b.id, buildingType);
    // Track mines for proximity explosion detection
    if (buildingType === 'mine' && this.game && this.game.mines) {
      this.game.mines.push(b);
    }
    return b;
  }

  _buildBridge(tileX, tileY, cfg) {
    const span = this.tilemap.findBridgeSpan(tileX, tileY);
    if (!span) return null;
    const cost = (cfg.cost_per_tile || 15) * span.width;
    if (!this.canAfford(cost)) return null;
    if (!this.spend(cost)) return null;
    const b = new Building('bridge', span.start, tileY, this.id, span.width, this.tilemap);
    this.buildings.push(b);
    return b;
  }

  trainUnit(building, unitType) {
    const cfg = UNIT_TYPES[unitType];
    if (!cfg || !this.canAfford(cfg.cost)) return false;
    if (building.queueTrain(unitType)) {
      this.spend(cfg.cost);
      return true;
    }
    return false;
  }

  spawnUnit(unitType, x, y) {
    const u = new Unit(unitType, x, y, this.id);
    this.units.push(u);
    return u;
  }

  update(dt) {
    const trained = [];
    for (const b of this.buildings) {
      const result = b.update(dt);
      if (result) trained.push([result, b]);
      if (b.isBridge && b.built && !b.bridgeTilesPlaced) {
        this.tilemap.setBridgeTiles(b.tileX, b.tileY, b.wTiles);
        b.bridgeTilesPlaced = true;
      }
      if (!b.alive) {
        if (b.isBridge && b.bridgeTilesPlaced) {
          this.tilemap.clearBridgeTiles(b.tileX, b.tileY, b.wTiles);
          b.bridgeTilesPlaced = false;
        }
        if (b.built) {
          this.tilemap.clearBuildingTiles(b.tileX, b.tileY, b.wTiles, b.hTiles);
        }
      }
    }
    this.buildings = this.buildings.filter(b => b.alive);
    this.units = this.units.filter(u => u.alive);
    if (this.hq && !this.hq.alive) this.alive = false;
    return trained;
  }

  get totalIncome() {
    return this.buildings
      .filter(b => b.providesIncome && b.built && b.alive)
      .reduce((sum, b) => sum + b.incomeAmount, 0);
  }

  get unitCount() { return this.units.length; }
  get buildingCount() { return this.buildings.length; }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 10: HUMAN PLAYER
// ═══════════════════════════════════════════════════════════════
class HumanPlayer extends Player {
  constructor(playerId, startX, tilemap) {
    super(playerId, startX, tilemap);
    this.selectedUnits = [];
    this.selectedBuilding = null;
    this.buildMode = null;
    this.buildPreviewTx = 0;
    this.buildPreviewTy = 0;
  }

  handleTap(worldX, worldY, allUnits, allBuildings) {
    if (this.buildMode) {
      const tx = floor(worldX / TILE_SIZE);
      const ty = floor(worldY / TILE_SIZE);
      const result = this.build(this.buildMode, tx, ty);
      this.buildMode = null;
      return result ? 'built' : 'build_failed';
    }

    const tappedUnit = this._findUnitAt(worldX, worldY, this.units);
    if (tappedUnit) {
      this._deselectAll();
      tappedUnit.selected = true;
      this.selectedUnits = [tappedUnit];
      this.selectedBuilding = null;
      return 'select_unit';
    }

    const tappedBldg = this._findBuildingAt(worldX, worldY, this.buildings);
    if (tappedBldg) {
      this._deselectAll();
      this.selectedBuilding = tappedBldg;
      return 'select_building';
    }

    const enemyUnit = this._findNearestEnemyAt(worldX, worldY, allUnits);
    if (enemyUnit && this.selectedUnits.length > 0) {
      for (const u of this.selectedUnits) {
        u.target = enemyUnit;
        u.moveTargetX = enemyUnit.x;
      }
      return 'attack_order';
    }

    const enemyBldg = this._findBuildingAt(worldX, worldY, allBuildings, true);
    if (enemyBldg && this.selectedUnits.length > 0) {
      for (const u of this.selectedUnits) {
        u.target = enemyBldg;
        u.moveTargetX = enemyBldg.x;
      }
      return 'attack_order';
    }

    if (this.selectedUnits.length > 0) {
      for (const u of this.selectedUnits) {
        u.moveTargetX = worldX;
        u.target = null;
      }
      return 'move_order';
    }

    this._deselectAll();
    return 'deselect';
  }

  enterBuildMode(buildingType) {
    this.buildMode = buildingType;
    this._deselectAll();
  }

  updateBuildPreview(worldX, worldY) {
    this.buildPreviewTx = floor(worldX / TILE_SIZE);
    this.buildPreviewTy = floor(worldY / TILE_SIZE);
  }

  cancelBuildMode() { this.buildMode = null; }

  _deselectAll() {
    for (const u of this.selectedUnits) u.selected = false;
    this.selectedUnits = [];
    this.selectedBuilding = null;
  }

  // Select all own units whose center falls within the given screen-space box
  // (sx1,sy1) = top-left, (sx2,sy2) = bottom-right in screen pixels
  selectUnitsInBox(sx1, sy1, sx2, sy2, camera) {
    const { wx: wx1, wy: wy1 } = camera.screenToWorld(sx1, sy1);
    const { wx: wx2, wy: wy2 } = camera.screenToWorld(sx2, sy2);
    const left = Math.min(wx1, wx2);
    const right = Math.max(wx1, wx2);
    const top = Math.min(wy1, wy2);
    const bottom = Math.max(wy1, wy2);
    this._deselectAll();
    for (const u of this.units) {
      if (!u.alive) continue;
      const cx = u.x, cy = u.y + u.height / 2;
      if (cx >= left && cx <= right && cy >= top && cy <= bottom) {
        u.selected = true;
        this.selectedUnits.push(u);
      }
    }
  }

  _findUnitAt(wx, wy, units) {
    const margin = 30;
    for (const u of units) {
      if (!u.alive) continue;
      const r = u.rect;
      if (r[0] - margin <= wx && wx <= r[0] + r[2] + margin &&
          r[1] - margin <= wy && wy <= r[1] + r[3] + margin) {
        return u;
      }
    }
    return null;
  }

  _findBuildingAt(wx, wy, buildings, enemyOnly = false) {
    for (const b of buildings) {
      if (!b.alive) continue;
      if (enemyOnly && b.ownerId === this.id) continue;
      if (!enemyOnly && b.ownerId !== this.id) continue;
      const r = b.rect;
      if (r[0] <= wx && wx <= r[0] + r[2] && r[1] <= wy && wy <= r[1] + r[3]) {
        return b;
      }
    }
    return null;
  }

  _findNearestEnemyAt(wx, wy, units, radius = 50) {
    let best = null, bestDist = radius + 1;
    for (const u of units) {
      if (!u.alive || u.ownerId === this.id) continue;
      const dx = wx - u.x, dy = wy - u.centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < bestDist) { best = u; bestDist = dist; }
    }
    return best;
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 11: CPU PLAYER
// ═══════════════════════════════════════════════════════════════
class CpuPlayer extends Player {
  constructor(playerId, startX, tilemap) {
    super(playerId, startX, tilemap);
    this.thinkTimer = AI_THINK_INTERVAL;
    this.aggression = 0.3;
    this.gameTime = 0;
    this._hasBarracks = false;
    this._hasWorkshop = false;
  }

  aiUpdate(dt, enemyPlayers) {
    this.gameTime += dt;
    this.aggression = Math.min(1.0, 0.3 + this.gameTime * AI_AGGRESSION_RAMP);
    this.thinkTimer -= dt;
    if (this.thinkTimer > 0) return;
    this.thinkTimer = AI_THINK_INTERVAL + (Math.random() - 0.5);

    this._checkBuildings();
    this._checkTraining();
    this._checkOrders(enemyPlayers);
  }

  _checkBuildings() {
    const counts = {};
    for (const b of this.buildings) { if (b.alive) counts[b.type] = (counts[b.type] || 0) + 1; }
    this._hasBarracks = (counts.barracks || 0) > 0;
    this._hasWorkshop = (counts.workshop || 0) > 0;

    if (!this._hasBarracks && this.canAfford(BUILDING_TYPES.barracks.cost)) this._tryBuild('barracks');
    else if ((counts.mine || 0) < 2 && this.canAfford(BUILDING_TYPES.mine.cost)) this._tryBuild('mine');
    else if ((counts.turret || 0) < 3 && this.canAfford(BUILDING_TYPES.turret.cost)) this._tryBuild('turret');
    else if (!this._hasWorkshop && this.canAfford(BUILDING_TYPES.workshop.cost)) this._tryBuild('workshop');
    else if ((counts.barracks || 0) < 2 && this.canAfford(BUILDING_TYPES.barracks.cost)) this._tryBuild('barracks');
    else if ((counts.wall || 0) < 4 && this.canAfford(BUILDING_TYPES.wall.cost)) this._tryBuild('wall');
  }

  _tryBuild(buildingType) {
    const cfg = BUILDING_TYPES[buildingType];
    const w = cfg.width_tiles, h = cfg.height_tiles;
    const baseTx = floor(this.startX / TILE_SIZE);
    const gsY = this.tilemap.groundSurfaceTileY();
    const ty = gsY - h;
    for (let offset = 0; offset < 40; offset++) {
      for (const sign of [1, -1]) {
        const tx = baseTx + offset * sign;
        if (tx < 0 || tx + w >= this.tilemap.width) continue;
        if (this.tilemap.canPlaceBuilding(tx, ty, w, h)) {
          this.build(buildingType, tx, ty);
          return;
        }
      }
    }
  }

  _checkTraining() {
    for (const b of this.buildings) {
      if (!b.built || !b.canTrain.length || !b.alive) continue;
      const queueSize = b.trainQueue.length + (b.trainCurrent ? 1 : 0);
      if (queueSize >= 2) continue;
      let unitType = 'soldier';
      if (this.unitCount < 3 || Math.random() < 0.6) unitType = 'soldier';
      else if (Math.random() < 0.3) unitType = 'heavy';
      else if (Math.random() < 0.5 && this._hasWorkshop && b.canTrain.includes('engineer')) unitType = 'engineer';
      else unitType = b.canTrain[Math.floor(Math.random() * b.canTrain.length)];
      this.trainUnit(b, unitType);
    }
  }

  _checkOrders(enemyPlayers) {
    if (!enemyPlayers.length) return;
    const targetPlayer = enemyPlayers[Math.floor(Math.random() * enemyPlayers.length)];
    if (!targetPlayer.alive) return;
    const idleUnits = this.units.filter(u => u.alive && u.state === 'idle');
    if (!idleUnits.length) return;
    if (idleUnits.length >= 3 && Math.random() < this.aggression) {
      const target = targetPlayer.hq;
      if (target && target.alive) {
        for (const u of idleUnits) { u.target = target; u.moveTargetX = target.x; }
      }
    } else if (idleUnits.length >= 1 && Math.random() < 0.3) {
      for (const u of idleUnits) {
        u.moveTargetX = this.startX + (Math.random() - 0.5) * 300;
        u.target = null;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 12: COMBAT SYSTEM
// ═══════════════════════════════════════════════════════════════
class CombatSystem {
  constructor() { this.projectiles = []; }

  update(dt, players, tilemap) {
    const allUnits = players.flatMap(p => p.units);
    const allBuildings = players.flatMap(p => p.buildings);

    this._processMelee(allUnits);
    this._processUnitVsBuilding(allUnits, allBuildings);
    this._processTurrets(allBuildings, allUnits);
    for (const p of this.projectiles) p.update(dt);
    this._processProjectileHits(allUnits, allBuildings);
    const worldW = tilemap.width * TILE_SIZE;
    this.projectiles = this.projectiles.filter(p => p.alive && !p.isOffscreen(worldW));
  }

  _processMelee(allUnits) {
    for (const u of allUnits) {
      if (!u.alive || !u.canAttack()) continue;
      if (u.target && (!u.target.alive || typeof u.target.x !== 'number')) u.target = null;
      let nearest = null, nearestDist = u.attackRange + 1;
      for (const other of allUnits) {
        if (!other.alive || other.ownerId === u.ownerId) continue;
        const dist = Math.abs(u.x - other.x);
        if (dist < nearestDist) { nearestDist = dist; nearest = other; }
      }
      if (nearest) {
        u.performAttack();
        const dir = nearest.x > u.x ? 1 : -1;
        // Spawn a visible bullet projectile for unit-vs-unit combat
        this.projectiles.push(new Projectile(u.x, u.centerY, dir, u.damage, u.ownerId, nearest.x, nearest.centerY));
        if (!u.target) u.target = nearest;
      }
    }
  }

  _processUnitVsBuilding(allUnits, allBuildings) {
    for (const u of allUnits) {
      if (!u.alive || !u.canAttack()) continue;
      const t = u.target;
      if (!t || !(t instanceof Building) || !t.alive) continue;
      if (t.ownerId === u.ownerId) {
        if (u.canRepair && t.hp < t.maxHp) u.state = 'repairing';
        continue;
      }
      const dx = Math.abs(u.x - t.x), dy = Math.abs(u.centerY - t.centerY);
      if (dx < t.width / 2 + u.attackRange && dy < t.height / 2 + 20) {
        u.performAttack();
        const dir = t.x > u.x ? 1 : -1;
        this.projectiles.push(new Projectile(u.x, u.centerY, dir, u.damage, u.ownerId, t.centerX, t.centerY));
      }
    }
  }

  _processTurrets(allBuildings, allUnits) {
    for (const b of allBuildings) {
      if (!b.canAttackNow()) continue;
      let nearest = null, nearestDist = b.attackRange + 1;
      for (const u of allUnits) {
        if (!u.alive || u.ownerId === b.ownerId) continue;
        const dist = Math.sqrt((u.x - b.x) ** 2 + (u.centerY - b.centerY) ** 2);
        if (dist < nearestDist) { nearestDist = dist; nearest = u; }
      }
      if (nearest) {
        b.performAttack();
        const dir = nearest.x > b.x ? 1 : -1;
        this.projectiles.push(new Projectile(b.x, b.centerY, dir, b.attackDamage, b.ownerId, nearest.x, nearest.centerY));
      }
    }
  }

  _processProjectileHits(allUnits, allBuildings) {
    for (const p of this.projectiles) {
      if (!p.alive) continue;
      for (const u of allUnits) {
        if (!u.alive || u.ownerId === p.ownerId) continue;
        const dx = Math.abs(p.x - u.x), dy = Math.abs(p.y - u.centerY);
        if (dx < u.width / 2 + p.radius && dy < u.height / 2 + p.radius) {
          u.takeDamage(p.damage);
          p.kill();
          break;
        }
      }
      if (!p.alive) continue;
      for (const b of allBuildings) {
        if (!b.alive || b.ownerId === p.ownerId) continue;
        const r = b.rect;
        if (r[0] - p.radius <= p.x && p.x <= r[0] + r[2] + p.radius &&
            r[1] - p.radius <= p.y && p.y <= r[1] + r[3] + p.radius) {
          b.takeDamage(p.damage);
          p.kill();
          break;
        }
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 13: ECONOMY SYSTEM
// ═══════════════════════════════════════════════════════════════
class EconomySystem {
  constructor() { this.timer = 0; }

  update(dt, players) {
    this.timer += dt;
    if (this.timer >= CREDIT_TICK_INTERVAL) {
      this.timer -= CREDIT_TICK_INTERVAL;
      for (const p of players) { if (p.alive) p.earn(p.totalIncome); }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 14: INPUT HANDLER
// ═══════════════════════════════════════════════════════════════
class InputHandler {
  constructor(onTap, onPan, onBuildHover, onSelectionBox) {
    this.onTap = onTap;
    this.onPan = onPan;
    this.onBuildHover = onBuildHover;
    this.onSelectionBox = onSelectionBox;
    this._pointerDown = null;
    this._panStartCamX = 0;
    this._panStartX = 0;
    this._swipeStarted = false;
    this._swipeStartX = 0;
    this._EDGE_THRESHOLD = 30;
    this._SWIPE_THRESHOLD = 30;
    this._DRAG_THRESHOLD = 8;
    this._lastX = 0;
    this._lastY = 0;
    // Drag-selection tracking
    this._dragStartX = 0;
    this._dragStartY = 0;
    this._isDragging = false;
  }

  fireHoverAtLastPosition() {
    this.onBuildHover && this.onBuildHover(this._lastX, this._lastY);
  }

  attach(canvas) {
    canvas.addEventListener('pointerdown', e => this._onPointerDown(e), { passive: false });
    canvas.addEventListener('pointermove', e => this._onPointerMove(e), { passive: false });
    canvas.addEventListener('pointerup',   e => this._onPointerUp(e),   { passive: false });
    canvas.addEventListener('pointercancel', e => this._onPointerUp(e), { passive: false });
    window.addEventListener('keydown', e => this._onKeyDown(e));
    window.addEventListener('keyup', e => this._onKeyUp(e));
  }

  _onPointerDown(e) {
    e.preventDefault();
    this._pointerDown = e.pointerId;
    this._panStartCamX = e.clientX;
    this._panStartX = e.clientX;
    this._lastX = e.clientX;
    this._lastY = e.clientY;
    this._swipeStarted = false;
    this._isDragging = false;
    this._dragStartX = e.clientX;
    this._dragStartY = e.clientY;
    if (e.clientX < this._EDGE_THRESHOLD) this._swipeStarted = true;
  }

  _onPointerMove(e) {
    e.preventDefault();
    this._lastX = e.clientX;
    this._lastY = e.clientY;
    if (this._pointerDown !== e.pointerId) return;
    if (e.clientX < this._EDGE_THRESHOLD && !this._swipeStarted) {
      this._swipeStarted = true;
    }
    this.onBuildHover && this.onBuildHover(e.clientX, e.clientY);
    const dx = e.clientX - this._panStartX;
    if (Math.abs(dx) > 8) {
      this.onPan && this.onPan(dx);
      this._panStartX = e.clientX;
    }
    // Detect drag-selection: non-edge drag with enough movement
    if (!this._swipeStarted && !this._isDragging) {
      const ddx = e.clientX - this._dragStartX;
      const ddy = e.clientY - this._dragStartY;
      if (Math.sqrt(ddx*ddx + ddy*ddy) > this._DRAG_THRESHOLD) {
        this._isDragging = true;
      }
    }
    // Live update: report current drag box whenever actively dragging
    if (this._isDragging && !this._swipeStarted) {
      const sx1 = Math.min(this._dragStartX, this._lastX);
      const sy1 = Math.min(this._dragStartY, this._lastY);
      const sx2 = Math.max(this._dragStartX, this._lastX);
      const sy2 = Math.max(this._dragStartY, this._lastY);
      this.onSelectionDrag && this.onSelectionDrag(sx1, sy1, sx2, sy2);
    }
  }

  _onPointerUp(e) {
    e.preventDefault();
    if (this._pointerDown !== e.pointerId) return;
    const wasSwipe = this._swipeStarted;
    const wasDrag = this._isDragging;
    this._pointerDown = null;
    this._swipeStarted = false;
    this._isDragging = false;
    if (wasDrag && !wasSwipe) {
      // Fire selection box: normalize to min/max corners
      const sx1 = Math.min(this._dragStartX, this._lastX);
      const sy1 = Math.min(this._dragStartY, this._lastY);
      const sx2 = Math.max(this._dragStartX, this._lastX);
      const sy2 = Math.max(this._dragStartY, this._lastY);
      this.onSelectionBox && this.onSelectionBox(sx1, sy1, sx2, sy2);
    } else if (!wasSwipe) {
      this.onTap && this.onTap(e.clientX, e.clientY);
    }
  }

  _onKeyDown(e) {
    if (e.key === 'q' || e.key === 'Q') {
      const menu = document.getElementById('build-menu');
      if (menu) menu.classList.toggle('open');
    }
    if (e.key === 'Escape') {
      if (window._fc_game) window._fc_game.cancelBuildMode && window._fc_game.cancelBuildMode();
    }
  }

  _onKeyUp(e) {}
}

// ═══════════════════════════════════════════════════════════════
// SECTION 15: RENDERER
// ═══════════════════════════════════════════════════════════════
// PIXEL ART SPRITE LIBRARY — NES 16-color palette, pixel-by-pixel
// ═══════════════════════════════════════════════════════════════
class SpriteLib {
  constructor() {
    this._spriteCache = {}; // "type:ownerId" -> OffscreenCanvas

    // NES-inspired 16-color palette: char -> [r,g,b]
    this.P = {
      _: [0,0,0],        // 0: transparent
      K: [30,30,40],     // 1: black / outline
      W: [90,90,115],    // 2: dark wall gray-blue
      w: [130,130,160],  // 3: light wall gray-blue
      R: [185,50,50],    // 4: red / roof
      r: [220,80,80],    // 5: light red
      B: [50,50,165],    // 6: blue (barracks)
      b: [80,80,210],    // 7: light blue
      G: [40,120,40],    // 8: dark green
      Y: [240,200,55],   // 9: yellow / sand / antenna
      O: [160,110,55],   // A: brown (barracks door, wall stone)
      o: [200,145,75],   // B: light brown
      D: [18,18,28],     // C: dark ground
      T: [160,160,180],  // D: turret metal
      t: [200,200,220],  // E: turret metal light
      H: [90,60,35],     // F: heavy body / helmet
      L: [210,170,90],   // G: scout body / light skin
      N: [120,70,35],    // H: heavy dark
      M: [80,180,80],    // I: mine green glow
      m: [180,255,100],  // J: mine bright
      X: [255,255,255],  // K: white / highlight
    };
    this._pal = this.P;

    // Sprite data — empty means all types fall back to colored rects
    this.DATA = {};
  }

  // Draw one sprite data array to an offscreen canvas, scaled up by SCALE
  _drawSprite(rows, artW, artH, SCALE, ownerColor) {
    const oc = document.createElement('canvas');
    oc.width = artW * SCALE;
    oc.height = artH * SCALE;
    const cx = oc.getContext('2d');
    cx.imageSmoothingEnabled = false;

    for (let row = 0; row < artH; row++) {
      const line = rows[row];
      for (let col = 0; col < artW; col++) {
        const key = line[col] || '_';
        let color = this._pal[key];
        if (!color) continue;

        // 'S' = body (player-colored), 'G' = scout body, 'N' = heavy body
        if (key === 'S' || key === 'G' || key === 'N') {
          color = ownerColor;
        }
        cx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
        cx.fillRect(col * SCALE, row * SCALE, SCALE, SCALE);
      }
    }
    return oc;
  }

  // Get (or create) the offscreen canvas for a given type + owner
  getSprite(type, ownerId, playerColors) {
    const key = `${type}:${ownerId}`;
    if (this._spriteCache[key]) return this._spriteCache[key];

    const def = this.DATA[type];
    if (!def) return null;

    const pc = playerColors[ownerId % playerColors.length];
    const oc = this._drawSprite(def.rows, def.w, def.h, def.scale, pc);
    this._spriteCache[key] = oc;
    return oc;
  }
}
// ═══════════════════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════════════════
class Renderer {
  constructor(ctx, canvasW, canvasH) {
    this.ctx = ctx;
    this.canvasW = canvasW;
    this.canvasH = canvasH;
    this.sprites = new SpriteLib();
  }

  clear() {
    const ctx = this.ctx;
    const grad = ctx.createLinearGradient(0, 0, 0, this.canvasH);
    grad.addColorStop(0, rgb(C.SKY_TOP));
    grad.addColorStop(1, rgb(C.SKY_BOT));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.canvasW, this.canvasH);
  }

  drawTerrain(tilemap, camX) {
    const ctx = this.ctx;
    const leftTile = Math.max(0, floor(camX / TILE_SIZE));
    const rightTile = Math.min(tilemap.width, floor((camX + this.canvasW) / TILE_SIZE) + 1);
    const topTile = 0;
    const bottomTile = tilemap.height;

    for (let tx = leftTile; tx < rightTile; tx++) {
      for (let ty = topTile; ty < bottomTile; ty++) {
        const tile = tilemap.getTile(tx, ty);
        if (tile === TILE_EMPTY) continue;
        const screen = this._worldToScreen(tx * TILE_SIZE, ty * TILE_SIZE);
        const color = tile === TILE_GROUND ? C.GROUND
              : tile === TILE_PLATFORM ? C.PLATFORM
              : tile === TILE_BRIDGE ? C.BRIDGE : C.GROUND;
        ctx.fillStyle = rgb(color);
        ctx.fillRect(screen.sx, screen.sy, TILE_SIZE, TILE_SIZE);
        if (tile === TILE_PLATFORM) {
          ctx.strokeStyle = 'rgba(255,255,255,0.08)';
          ctx.lineWidth = 1;
          ctx.strokeRect(screen.sx + 0.5, screen.sy + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
        }
      }
    }
  }

drawUnit(u, camX, playerColors) {
    const ctx = this.ctx;
    const screen = this._worldToScreen(u.x - u.width / 2, u.y);

    // Selection ring
    if (u.selected) {
      ctx.strokeStyle = C.SELECT;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(screen.sx - 2, screen.sy - 2, u.width + 4, u.height + 4, 4);
      ctx.stroke();
    }

    // Sprite
    const typeMap = { soldier:'soldier', heavy:'heavy', scout:'scout', tank:'heavy' };
    const spriteType = typeMap[u.type] || 'soldier';
    const sprite = this.sprites.getSprite(spriteType, u.ownerId, playerColors);

    if (sprite) {
      ctx.imageSmoothingEnabled = false;
      const sw = sprite.width;
      const sh = sprite.height;
      const def = this.sprites.DATA[spriteType];
      const go = def ? (def.groundOffset || 0) : 0;
      // Shift sprite up so its bottom lands at collision bottom (u.y + u.height)
      const dx = screen.sx + (u.width - sw) / 2;
      const dy = screen.sy - go;
      ctx.drawImage(sprite, dx, dy, sw, sh);
    } else {
      this._drawRealisticUnit(u, screen, pc);
    }

    // Damage flash overlay
    if (u.damageFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(screen.sx, screen.sy, u.width, u.height);
    }

    // Facing indicator
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    const fx = u.facing > 0 ? screen.sx + u.width - 4 : screen.sx + 2;
    ctx.beginPath();
    ctx.moveTo(fx, screen.sy + u.height * 0.3);
    ctx.lineTo(fx + u.facing * 5, screen.sy + u.height * 0.5);
    ctx.lineTo(fx, screen.sy + u.height * 0.7);
    ctx.closePath();
    ctx.fill();

    // HP bar
    if (u.hp < u.maxHp) {
      const barW = u.width;
      const barH = 3;
      const barX = screen.sx, barY = screen.sy - 6;
      ctx.fillStyle = '#333';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = u.hp > u.maxHp * 0.5 ? '#00FF66' : u.hp > u.maxHp * 0.25 ? '#FFAA00' : '#FF4D4D';
      ctx.fillRect(barX, barY, barW * (u.hp / u.maxHp), barH);
    }
  }

  drawBuilding(b, camX, playerColors) {
    const ctx = this.ctx;
    const screen = this._worldToScreen(b.x - b.width / 2, b.y);

    // Selection ring
    if (b.selected) {
      ctx.strokeStyle = C.SELECT;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(screen.sx - 2, screen.sy - 2, b.width + 4, b.height + 4, 3);
      ctx.stroke();
    }

    // Sprite
    const sprite = this.sprites.getSprite(b.type, b.ownerId, playerColors);
    if (sprite) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sprite, screen.sx, screen.sy, b.width, b.height);
    } else {
      const pc = playerColors[b.ownerId % playerColors.length];
      this._drawRealisticBuilding(b, screen, pc);
    }

    // Under-construction overlay (hatched + progress bar)
    if (!b.built) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#1a2a4a';
      ctx.fillRect(screen.sx, screen.sy, b.width, b.height);
      // Diagonal hatch lines
      ctx.strokeStyle = '#3380FF';
      ctx.lineWidth = 1;
      for (let i = -b.height; i < b.width; i += 6) {
        ctx.beginPath();
        ctx.moveTo(screen.sx + i, screen.sy);
        ctx.lineTo(screen.sx + i + b.height, screen.sy + b.height);
        ctx.stroke();
      }
      ctx.restore();

      const barW = b.width;
      const barH = 4;
      const barX = screen.sx, barY = screen.sy + b.height + 2;
      ctx.fillStyle = '#222';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#3380FF';
      ctx.fillRect(barX, barY, barW * b.buildProgress, barH);
      return;
    }

    // HP bar
    if (b.hp < b.maxHp) {
      const barW = b.width;
      const barH = 3;
      const barX = screen.sx, barY = screen.sy - 6;
      ctx.fillStyle = '#333';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = b.hp > b.maxHp * 0.5 ? '#00FF66' : b.hp > b.maxHp * 0.25 ? '#FFAA00' : '#FF4D4D';
      ctx.fillRect(barX, barY, barW * (b.hp / b.maxHp), barH);
    }
  }

  // ---- Realistic layered rendering helpers ----

  // Lerp two [r,g,b] color arrays by t
  _lerpColor(a, b, t) {
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  }

  // Draw realistic unit body (helmet, gradient fill, shadows)
  // u: unit object, screen: {sx,sy}, pc: playerColor [r,g,b]
  _drawRealisticUnit(u, screen, pc) {
    const ctx = this.ctx;
    const { sx, sy } = screen;
    const w = u.width, h = u.height;

    // Ground shadow
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0)';
    const gs = ctx.createLinearGradient(sx, sy + h, sx, sy + h + 7);
    gs.addColorStop(0, 'rgba(0,0,0,0.28)');
    gs.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gs;
    ctx.beginPath();
    ctx.ellipse(sx + w/2 + 3, sy + h + 3, w/2 + 3, 4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Drop shadow
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 4;

    // Body gradient fill
    const bodyGrad = ctx.createLinearGradient(sx, sy, sx, sy + h);
    bodyGrad.addColorStop(0, rgb(this._lerpColor(pc, [1,1,1], 0.28)));
    bodyGrad.addColorStop(0.4, rgb(pc));
    bodyGrad.addColorStop(1, rgb(this._lerpColor(pc, [0,0,0], 0.32)));
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.roundRect(sx, sy, w, h, 3);
    ctx.fill();

    ctx.shadowColor = 'rgba(0,0,0,0)';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // Top rim highlight
    const topG = ctx.createLinearGradient(sx, sy, sx, sy + 8);
    topG.addColorStop(0, 'rgba(255,255,255,0.38)');
    topG.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = topG;
    ctx.beginPath();
    ctx.roundRect(sx, sy, w, h, 3);
    ctx.fill();

    // Bottom inner shadow
    const botG = ctx.createLinearGradient(sx, sy + h - 10, sx, sy + h);
    botG.addColorStop(0, 'rgba(0,0,0,0)');
    botG.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = botG;
    ctx.beginPath();
    ctx.roundRect(sx, sy, w, h, 3);
    ctx.fill();

    // Helmet
    const helmW = w * 0.78;
    const helmH = h * 0.36;
    const helmX = sx + (w - helmW) / 2;
    const helmY = sy + 2;
    const helmGrad = ctx.createLinearGradient(helmX, helmY, helmX, helmY + helmH);
    helmGrad.addColorStop(0, '#606060');
    helmGrad.addColorStop(1, '#242424');
    ctx.fillStyle = helmGrad;
    ctx.beginPath();
    ctx.roundRect(helmX, helmY, helmW, helmH, [2, 2, 1, 1]);
    ctx.fill();
    // Helmet brim
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.roundRect(helmX - 2, helmY + helmH - 4, helmW + 4, 5, 1);
    ctx.fill();
  }

  // Draw realistic building body (gradient fill, shadows, rim lights, type details)
  // b: building object, screen: {sx,sy}, pc: playerColor [r,g,b]
  _drawRealisticBuilding(b, screen, pc) {
    const ctx = this.ctx;
    const { sx, sy } = screen;
    const w = b.width, h = b.height;
    const r = 3;

    // Ground shadow (perspective cast right)
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0)';
    const gs = ctx.createLinearGradient(sx, sy + h, sx, sy + h + 12);
    gs.addColorStop(0, 'rgba(0,0,0,0.32)');
    gs.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gs;
    ctx.beginPath();
    ctx.moveTo(sx + 5, sy + h);
    ctx.lineTo(sx + w - 5, sy + h);
    ctx.lineTo(sx + w + 4, sy + h + 12);
    ctx.lineTo(sx - 3, sy + h + 12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Drop shadow
    ctx.shadowColor = 'rgba(0,0,0,0.42)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetX = 5;
    ctx.shadowOffsetY = 7;

    // Body gradient
    const dimmed = !b.built;
    const faceGrad = ctx.createLinearGradient(sx, sy, sx, sy + h);
    if (dimmed) {
      faceGrad.addColorStop(0, rgba(this._lerpColor(pc,[1,1,1],0.14), 0.62));
      faceGrad.addColorStop(1, rgba(this._lerpColor(pc,[0,0,0],0.22), 0.62));
    } else {
      faceGrad.addColorStop(0, rgb(this._lerpColor(pc, [1,1,1], 0.26)));
      faceGrad.addColorStop(0.3, rgb(pc));
      faceGrad.addColorStop(0.72, rgb(this._lerpColor(pc, [0,0,0], 0.16)));
      faceGrad.addColorStop(1, rgb(this._lerpColor(pc, [0,0,0], 0.38)));
    }
    ctx.fillStyle = faceGrad;
    ctx.beginPath();
    ctx.roundRect(sx, sy, w, h, r);
    ctx.fill();

    ctx.shadowColor = 'rgba(0,0,0,0)';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // Top rim highlight
    const topG = ctx.createLinearGradient(sx, sy, sx, sy + 9);
    topG.addColorStop(0, rgb(this._lerpColor(pc, [1,1,1], 0.46)));
    topG.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = topG;
    ctx.beginPath();
    ctx.moveTo(sx + r, sy);
    ctx.lineTo(sx + w - r, sy);
    ctx.quadraticCurveTo(sx + w, sy, sx + w, sy + r);
    ctx.lineTo(sx + w, sy + 8);
    ctx.lineTo(sx, sy + 8);
    ctx.lineTo(sx, sy + r);
    ctx.quadraticCurveTo(sx, sy, sx + r, sy);
    ctx.closePath();
    ctx.fill();

    // Left edge highlight
    const leftG = ctx.createLinearGradient(sx, sy, sx + 8, sy);
    leftG.addColorStop(0, rgb(this._lerpColor(pc, [1,1,1], 0.42)));
    leftG.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = leftG;
    ctx.beginPath();
    ctx.moveTo(sx, sy + r);
    ctx.lineTo(sx + 6, sy + r);
    ctx.lineTo(sx + 6, sy + h - r);
    ctx.lineTo(sx, sy + h - r);
    ctx.quadraticCurveTo(sx, sy + h, sx + r, sy + h);
    ctx.lineTo(sx + r, sy);
    ctx.quadraticCurveTo(sx, sy, sx, sy + r);
    ctx.closePath();
    ctx.fill();

    // Bottom-right inner shadow
    const botG = ctx.createLinearGradient(sx, sy + h - 12, sx, sy + h);
    botG.addColorStop(0, 'rgba(0,0,0,0)');
    botG.addColorStop(1, 'rgba(0,0,0,0.32)');
    ctx.fillStyle = botG;
    ctx.beginPath();
    ctx.moveTo(sx + r, sy + h);
    ctx.lineTo(sx + w - r, sy + h);
    ctx.quadraticCurveTo(sx + w, sy + h, sx + w, sy + h - r);
    ctx.lineTo(sx + w, sy + h - 12);
    ctx.lineTo(sx, sy + h - 12);
    ctx.lineTo(sx, sy + h - r);
    ctx.quadraticCurveTo(sx, sy + h, sx + r, sy + h);
    ctx.closePath();
    ctx.fill();

    // Right edge darkening
    const rightG = ctx.createLinearGradient(sx + w - 9, sy, sx + w, sy);
    rightG.addColorStop(0, 'rgba(0,0,0,0)');
    rightG.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = rightG;
    ctx.beginPath();
    ctx.moveTo(sx + w - 9, sy + r);
    ctx.lineTo(sx + w, sy + r);
    ctx.quadraticCurveTo(sx + w, sy, sx + w - r, sy);
    ctx.lineTo(sx + w - 9, sy);
    ctx.closePath();
    ctx.fill();

    // ---- Type-specific interior details ----
    if (b.built) {
      const detAlpha = 'rgba(255,255,255,0.82)';
      const detAlpha2 = 'rgba(255,255,255,0.5)';

      if (b.type === 'hq') {
        // Flag pole
        const poleX = sx + w * 0.72, poleTop = sy + 4, poleBot = sy + h * 0.55;
        ctx.strokeStyle = 'rgba(255,255,255,0.72)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(poleX, poleTop);
        ctx.lineTo(poleX, poleBot);
        ctx.stroke();
        // Pennant
        ctx.fillStyle = rgb(pc);
        ctx.beginPath();
        ctx.moveTo(poleX, poleTop);
        ctx.lineTo(poleX + 18, poleTop + 5);
        ctx.lineTo(poleX, poleTop + 10);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.lineWidth = 0.8;
        ctx.stroke();

        // Window row — three windows
        const winY = sy + h * 0.36, winH = 10, winW = 12, gap = 6;
        const totalW = winW * 3 + gap * 2;
        const startX = sx + (w - totalW) / 2;
        for (let i = 0; i < 3; i++) {
          const wx = startX + i * (winW + gap);
          ctx.fillStyle = 'rgba(0,0,0,0.44)';
          ctx.beginPath();
          ctx.roundRect(wx + 1, winY + 1, winW, winH, 2);
          ctx.fill();
          const wg = ctx.createLinearGradient(wx, winY, wx, winY + winH);
          wg.addColorStop(0, '#6699CC');
          wg.addColorStop(0.5, '#88BBEE');
          wg.addColorStop(1, '#4477AA');
          ctx.fillStyle = wg;
          ctx.beginPath();
          ctx.roundRect(wx, winY, winW, winH, 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.28)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(wx + winW/2, winY + 1);
          ctx.lineTo(wx + winW/2, winY + winH - 1);
          ctx.moveTo(wx + 1, winY + winH/2);
          ctx.lineTo(wx + winW - 1, winY + winH/2);
          ctx.stroke();
        }

        // Door
        const doorW = 18, doorH = 22;
        const doorX = sx + (w - doorW) / 2;
        const doorY = sy + h - doorH - 4;
        ctx.fillStyle = 'rgba(0,0,0,0.52)';
        ctx.beginPath();
        ctx.roundRect(doorX, doorY, doorW, doorH, [2, 2, 0, 0]);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(doorX, doorY, doorW, doorH, [2, 2, 0, 0]);
        ctx.stroke();
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(doorX + doorW - 5, doorY + doorH/2, 2, 0, Math.PI*2);
        ctx.fill();

      } else if (b.type === 'turret') {
        // Barrel
        ctx.fillStyle = 'rgba(255,255,255,0.62)';
        ctx.fillRect(sx + w * 0.34, sy + h * 0.3, w * 0.32, 7);
      } else if (b.type === 'mine') {
        // Diamond
        const cx = sx + w/2, cy = sy + h/2;
        ctx.fillStyle = 'rgba(255,200,0,0.72)';
        ctx.beginPath();
        ctx.moveTo(cx, cy - 9); ctx.lineTo(cx + 8, cy);
        ctx.lineTo(cx, cy + 9); ctx.lineTo(cx - 8, cy);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      } else if (b.type === 'barracks' || b.type === 'workshop') {
        // Figure silhouette (head + body)
        ctx.fillStyle = 'rgba(255,255,255,0.52)';
        ctx.beginPath();
        ctx.arc(sx + w/2, sy + h * 0.34, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(sx + w/2 - 3, sy + h * 0.40, 6, 9);
      }
    }
  }

  drawProjectile(p, camX) {
    const ctx = this.ctx;
    const { sx, sy } = this._worldToScreen(p.x, p.y);
    // Directional trail - length based on speed
    const trailLen = 14;
    const angle = p._angle;
    const tx = sx - Math.cos(angle) * trailLen;
    const ty = sy - Math.sin(angle) * trailLen;
    ctx.strokeStyle = 'rgba(255,220,80,0.4)';
    ctx.lineWidth = p.radius * 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    // Bullet head
    ctx.fillStyle = '#FFFF80';
    ctx.beginPath();
    ctx.arc(sx, sy, p.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw a CTF flag pennant at world position (wx, wy).
  // ownerCol is [r,g,b] of the flag's owner.
  // wx, wy = GROUND LEVEL base of the flag pole.
  drawCtfFlag(wx, wy, ownerCol, camX) {
    const ctx = this.ctx;
    const { sx, sy } = this._worldToScreen(wx - 10, wy);
    const col = rgb(ownerCol);
    // Pole — base at ground (sx+10, sy), top at (sx+10, sy-28)
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx + 10, sy);        // base on ground
    ctx.lineTo(sx + 10, sy - 28);   // top of pole
    ctx.stroke();
    // Pennant (pointing right) — hangs from top of pole
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(sx + 10, sy - 28);  // top of pole
    ctx.lineTo(sx + 28, sy - 21);  // tip
    ctx.lineTo(sx + 10, sy - 14);  // bottom of pennant
    ctx.closePath();
    ctx.fill();
  }

  // Draw a small flag icon above a unit that is carrying a flag.
  // carrierCol is the color of the flag being carried.
  drawFlagCarrier(u, carrierCol, camX) {
    const ctx = this.ctx;
    const screen = this._worldToScreen(u.x - u.width / 2, u.y);
    const col = rgb(carrierCol);
    const fx = screen.sx + u.width / 2;
    const fy = screen.sy - 10;
    // Mini pennant
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(fx - 4, fy);
    ctx.lineTo(fx + 6, fy + 4);
    ctx.lineTo(fx - 4, fy + 8);
    ctx.closePath();
    ctx.fill();
    // Pole
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(fx - 4, fy + 8);
    ctx.lineTo(fx - 4, fy + 16);
    ctx.stroke();
  }

  drawBuildPreview(tx, ty, valid, buildingType, camX) {
    const ctx = this.ctx;
    const cfg = BUILDING_TYPES[buildingType];
    const w = cfg.width_tiles * TILE_SIZE, h = cfg.height_tiles * TILE_SIZE;
    const { sx, sy } = this._worldToScreen(tx * TILE_SIZE, ty * TILE_SIZE);
    ctx.strokeStyle = valid ? 'rgba(0,255,100,0.6)' : 'rgba(255,50,50,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(sx, sy, w, h, 3);
    ctx.stroke();
  }

  _worldToScreen(wx, wy) {
    return { sx: wx - (window._fc_camX || 0), sy: wy };
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 16: MINIMAP RENDERER
// ═══════════════════════════════════════════════════════════════
class MinimapRenderer {
  constructor(ctx, mmW, mmH, tilemap) {
    this.ctx = ctx;
    this.mmW = mmW;
    this.mmH = mmH;
    this.tilemap = tilemap;
  }

  render(camX, players) {
    const ctx = this.ctx;
    const scaleX = this.mmW / (this.tilemap.width * TILE_SIZE);
    const scaleY = this.mmH / (this.tilemap.height * TILE_SIZE);
    ctx.clearRect(0, 0, this.mmW, this.mmH);
    // Ground baseline
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, this.mmW, this.mmH);
    // Platforms as thin lines
    ctx.fillStyle = 'rgba(80,80,80,0.8)';
    for (let tx = 0; tx < this.tilemap.width; tx++) {
      for (let ty = 0; ty < this.tilemap.height; ty++) {
        const tile = this.tilemap.getTile(tx, ty);
        if (tile !== TILE_EMPTY) {
          ctx.fillStyle = tile === TILE_GROUND ? '#4D3D2E'
                : tile === TILE_PLATFORM ? '#595248'
                : tile === TILE_BRIDGE ? '#734D26' : '#333';
          ctx.fillRect(tx * TILE_SIZE * scaleX, ty * TILE_SIZE * scaleY,
                       TILE_SIZE * scaleX + 0.5, TILE_SIZE * scaleY + 0.5);
        }
      }
    }
    // Players
    for (const p of players) {
      const col = C.PLAYER[p.id % C.PLAYER.length];
      ctx.fillStyle = rgb(col);
      for (const b of p.buildings) {
        if (!b.alive) continue;
        ctx.fillRect(b.x * scaleX - 2, b.y * scaleY - 2, 4, 4);
      }
      ctx.fillStyle = rgb([col[0]+0.2, col[1]+0.2, col[2]+0.2]);
      for (const u of p.units) {
        if (!u.alive) continue;
        ctx.fillRect(u.x * scaleX - 1, u.y * scaleY - 1, 3, 3);
      }
    }
    // Camera viewport
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    const vpW = (window._fc_viewW || 800) * scaleX;
    const vpX = (window._fc_camX || 0) * scaleX;
    ctx.strokeRect(vpX, 0, vpW, this.mmH);
  }
}

// ═══════════════════════════════════════════════════════════════
// SECTION 17: GAME (MAIN)
// ═══════════════════════════════════════════════════════════════
class FortressCommand {
  constructor() {
    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.mmCanvas = document.getElementById('minimap-canvas');
    this.mmCtx = this.mmCanvas.getContext('2d');
    this.previewCanvas = document.getElementById('preview-canvas');
    this.previewCtx = this.previewCanvas.getContext('2d');

    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.scene = 'menu'; // menu | game | gameover
    this.mode = '1v1_cpu';
    this.players = [];
    this.human = null;
    this.tilemap = null;
    this.camera = null;
    this.combatSys = new CombatSystem();
    this.economySys = new EconomySystem();
    this.renderer = new Renderer(this.ctx, this.viewW, this.viewH);
    this.minimap = null;
    this._lastTime = 0;
    this._gameOver = false;
    this._winner = null;
    this._buildMenuOpen = false;

    this._setupMenuUI();
    this._loop(0);
  }

  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.viewW = window.innerWidth;
    this.viewH = window.innerHeight;
    this.canvas.width = this.viewW * dpr;
    this.canvas.height = this.viewH * dpr;
    this.canvas.style.width = this.viewW + 'px';
    this.canvas.style.height = this.viewH + 'px';
    this.ctx.scale(dpr, dpr);
    this.previewCanvas.width = window.innerWidth * dpr;
    this.previewCanvas.height = window.innerHeight * dpr;
    this.previewCanvas.style.width = this.viewW + 'px';
    this.previewCanvas.style.height = this.viewH + 'px';
    this.previewCtx.scale(dpr, dpr);
    if (this.renderer) {
      this.renderer.canvasW = this.viewW;
      this.renderer.canvasH = this.viewH;
    }
    window._fc_viewW = this.viewW;
    window._fc_viewH = this.viewH;
  }

  _setupMenuUI() {
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        this.mode = btn.dataset.mode;
        this._startGame();
      });
    });
    document.getElementById('go-restart').addEventListener('click', () => this._startGame());
    document.getElementById('go-menu').addEventListener('click', () => this._showMenu());
    document.getElementById('build-tab').addEventListener('click', () => this._toggleBuildMenu());
    document.getElementById('menu-close').addEventListener('click', () => this._closeBuildMenu());
    this.mmCanvas.addEventListener('click', e => {
      if (this.scene !== 'game') return;
      const rect = this.mmCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const worldX = (mx / MINIMAP_W) * (MAP_WIDTH_TILES * TILE_SIZE);
      if (this.camera) this.camera.focusOn(worldX);
    });
    this._setupBuildMenuDOM();
  }

  _setupBuildMenuDOM() {
    // Delegated listener for train items — survives innerHTML rebuilds
    document.getElementById('train-list').addEventListener('click', (e) => {
      const item = e.target.closest('.train-item');
      if (!item || item.classList.contains('disabled')) return;
      const ut = item.dataset.unit;
      const p = this.human;
      const selB = p && p.selectedBuilding;
      if (p && selB && ut) {
        if (p.trainUnit(selB, ut)) {
          item.classList.add('queued');
          setTimeout(() => item.classList.remove('queued'), 350);
          this._updateBuildMenu();
          this._updateHUD();
        }
      }
    });

    const buildList = document.getElementById('build-list');
    buildList.innerHTML = '';
    const order = ['barracks','turret','wall','mine','workshop'];
    for (const t of order) {
      const cfg = BUILDING_TYPES[t];
      const item = document.createElement('div');
      item.className = 'menu-item';
      item.dataset.type = t;
      item.innerHTML = `<div class="menu-icon">${this._buildingIcon(t)}</div><div class="menu-name">${t.toUpperCase()}</div><div class="menu-cost">$${cfg.cost}</div>`;
      item.addEventListener('click', () => {
        if (this.human && this.human.canAfford(cfg.cost)) {
          this.human.enterBuildMode(t);
          this._closeBuildMenu();
          this.input && this.input.fireHoverAtLastPosition();
        }
      });
      buildList.appendChild(item);
    }
  }

  _buildingIcon(type) {
    return { hq:'🏠', barracks:'⚔', turret:'🔫', wall:'🧱', mine:'💎', workshop:'⚙', bridge:'🌉' }[type] || '🏗';
  }

  _toggleBuildMenu() {
    this._buildMenuOpen = !this._buildMenuOpen;
    document.getElementById('build-menu').classList.toggle('open', this._buildMenuOpen);
    document.getElementById('hud').classList.toggle('menu-open', this._buildMenuOpen);
    if (this._buildMenuOpen) this._updateBuildMenu();
  }

  _closeBuildMenu() {
    this._buildMenuOpen = false;
    document.getElementById('build-menu').classList.remove('open');
    document.getElementById('hud').classList.remove('menu-open');
  }

  _tickMenuAffordability() {
    if (!this._buildMenuOpen || !this.human) return;
    const p = this.human;
    document.querySelectorAll('#build-list .menu-item').forEach(item => {
      const cost = BUILDING_TYPES[item.dataset.type]?.cost;
      if (cost !== undefined) item.classList.toggle('disabled', !p.canAfford(cost));
    });
    document.querySelectorAll('#train-list .train-item').forEach(item => {
      const cost = UNIT_TYPES[item.dataset.unit]?.cost;
      if (cost !== undefined) item.classList.toggle('disabled', !p.canAfford(cost));
    });
  }

  _updateBuildMenu() {
    if (!this.human || !this._buildMenuOpen) return;
    const p = this.human;
    // Building items — just toggle disabled state
    document.querySelectorAll('#build-list .menu-item').forEach(item => {
      const t = item.dataset.type;
      const cost = BUILDING_TYPES[t].cost;
      item.classList.toggle('disabled', !p.canAfford(cost));
    });
    // Train section
    const selB = p.selectedBuilding;
    const trainSection = document.getElementById('train-section');
    const trainList = document.getElementById('train-list');
    if (selB && selB.canTrain && selB.canTrain.length > 0) {
      trainSection.style.display = 'block';
      trainList.innerHTML = '';
      for (const ut of selB.canTrain) {
        const cfg = UNIT_TYPES[ut];
        const item = document.createElement('div');
        item.className = 'train-item' + (p.canAfford(cfg.cost) ? '' : ' disabled');
        item.dataset.unit = ut;
        item.innerHTML = `<div class="menu-name">${ut.toUpperCase()}</div><div class="menu-cost">$${cfg.cost}</div>`;
        trainList.appendChild(item);
      }
    } else {
      trainSection.style.display = 'none';
    }
  }

  _startGame() {
    this.scene = 'game';
    this._gameOver = false;
    this._winner = null;
    _nextUnitId = 0;
    _nextBuildingId = 0;
    _nextProjectileId = 0;

    this.tilemap = new TileMap();
    this.tilemap.generate();

    this.camera = new Camera(this.viewW, this.viewH);
    this.camera.worldW = MAP_WIDTH_TILES * TILE_SIZE;
    this.camera.worldH = MAP_HEIGHT_TILES * TILE_SIZE;

    this.selectionBox = null; // {sx1,sy1,sx2,sy2} screen-space, set during drag

    const leftX = 4 * TILE_SIZE;
    const rightX = (MAP_WIDTH_TILES - 8) * TILE_SIZE;

    this.players = [];
    if (this.mode === '1v1_cpu' || this.mode === 'ctf_1v1_cpu') {
      this.players.push(new HumanPlayer(0, leftX, this.tilemap));
      this.players.push(new CpuPlayer(1, rightX, this.tilemap));
    } else if (this.mode === '1v1_local') {
