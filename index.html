      this.players.push(new HumanPlayer(0, leftX, this.tilemap));
      this.players.push(new HumanPlayer(1, rightX, this.tilemap));
    } else if (this.mode === 'ffa_3') {
      const midX = (MAP_WIDTH_TILES / 2) * TILE_SIZE;
      this.players.push(new HumanPlayer(0, leftX, this.tilemap));
      this.players.push(new CpuPlayer(1, midX, this.tilemap));
      this.players.push(new CpuPlayer(2, rightX, this.tilemap));
    } else if (this.mode === 'ffa_4') {
      const q1 = (MAP_WIDTH_TILES / 4) * TILE_SIZE;
      const q3 = (3 * MAP_WIDTH_TILES / 4) * TILE_SIZE;
      this.players.push(new HumanPlayer(0, leftX, this.tilemap));
      this.players.push(new CpuPlayer(1, q1, this.tilemap));
      this.players.push(new CpuPlayer(2, q3, this.tilemap));
      this.players.push(new CpuPlayer(3, rightX, this.tilemap));
    }

    // Wire game reference into players so buildings can access this.mines
    for (const p of this.players) p.game = this;

    this.human = this.players[0];
    this.mines = []; // mines are tracked separately for proximity explosion detection
    // CTF state — initialized only when CTF mode is active
    this.ctf = null;
    if (this.mode.startsWith('ctf')) {
      // Each player's flag starts at their base (alongside their HQ)
      this.ctf = {};
      for (const p of this.players) {
        this.ctf[p.id] = { atBase: true, carrierId: null };
      }
    }
    this.camera.focusOn(this.human.startX);
    this.camera.x = this.camera.targetX;

    this.minimap = new MinimapRenderer(this.mmCtx, MINIMAP_W, MINIMAP_H, this.tilemap);

    // Spawn initial soldiers
    for (const p of this.players) {
      for (let i = 0; i < 3; i++) {
        const gy = this.tilemap.getGroundY(p.startX);
        const u = p.spawnUnit('soldier', p.startX + (Math.random() - 0.5) * 40, gy);
        if (u) u.y = gy - u.height; // bottom of unit sits on ground surface
      }
    }

    // Input
    this.input = new InputHandler(
      (sx, sy) => this._onTap(sx, sy),
      (dx) => this._onPan(dx),
      (sx, sy) => this._onBuildHover(sx, sy),
      (sx1, sy1, sx2, sy2) => this._onSelectionBox(sx1, sy1, sx2, sy2),
      (sx1, sy1, sx2, sy2) => this._onSelectionDrag(sx1, sy1, sx2, sy2)
    );
    this.input.attach(this.canvas);

    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('mode-label').textContent = { '1v1_cpu':'1 vs CPU', '1v1_local':'1 vs 1 Local', 'ffa_3':'Free-for-All (3)', 'ffa_4':'Free-for-All (4)', 'ctf_1v1_cpu':'Capture the Flag' }[this.mode] || this.mode;
    this._updateHUD();
    window._fc_game = this;
  }

  _onTap(sx, sy) {
    if (this.scene !== 'game' || !this.camera) return;
    // Check if tap is in HUD area
    if (sy <= HUD_HEIGHT) {
      // could handle HUD button taps here
      return;
    }
    const { wx, wy } = this.camera.screenToWorld(sx, sy);
    const allUnits = this.players.flatMap(p => p.units);
    const allBuildings = this.players.flatMap(p => p.buildings);
    const result = this.human.handleTap(wx, wy, allUnits, allBuildings);
    if (result === 'select_building') this._updateBuildMenu();
    if (result === 'built') this._updateBuildMenu();
    this._updateHUD();
  }

  // Called during drag by InputHandler — tracks live box for rendering
  _onSelectionDrag(sx1, sy1, sx2, sy2) {
    if (this.scene !== 'game') return;
    this.selectionBox = { sx1, sy1, sx2, sy2 };
  }

  _onSelectionBox(sx1, sy1, sx2, sy2) {
    if (this.scene !== 'game' || !this.camera) return;
    // Ignore if box is entirely in HUD area
    if (sy1 <= HUD_HEIGHT && sy2 <= HUD_HEIGHT) {
      this.selectionBox = null;
      return;
    }
    this.human.selectUnitsInBox(sx1, sy1, sx2, sy2, this.camera);
    this.selectionBox = null;
    this._updateHUD();
  }

  _onPan(dx) {
    if (!this.camera) return;
    const speed = 0.5; // pixels of camera pan per pixel dragged
    this.camera.targetX = clamp(this.camera.targetX - dx * speed, 0, this.camera.worldW - this.viewW);
  }

  _onBuildHover(sx, sy) {
    if (!this.human || !this.human.buildMode || !this.camera) return;
    const { wx, wy } = this.camera.screenToWorld(sx, sy);
    this.human.updateBuildPreview(wx, wy);
  }

  _showMenu() {
    this.scene = 'menu';
    document.getElementById('menu-screen').classList.remove('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('game-version-num').textContent = GAME_VERSION;
  }

  _showGameOver(winner) {
    this.scene = 'gameover';
    this._winner = winner;
    const title = document.getElementById('go-title');
    const isVictory = winner && winner.id === 0;
    if (this.ctf) {
      title.textContent = isVictory ? 'FLAG CAPTURED!' : 'FLAG LOST';
    } else {
      title.textContent = isVictory ? 'VICTORY' : 'DEFEAT';
    }
    title.className = 'go-title ' + (isVictory ? 'victory' : 'defeat');
    document.getElementById('gameover-screen').classList.remove('hidden');
  }

_updateHUD() {
    if (!this.human) return;
    document.getElementById('hud-credits').textContent = `💰 ${this.human.credits}`;
    document.getElementById('hud-income').textContent = `+${this.human.totalIncome}/s`;

    const selUnits = this.human.selectedUnits;
    const selBldg = this.human.selectedBuilding;
    let info = 'TAP A UNIT OR BUILDING';
    if (this.ctf) {
      const myFlag = this.ctf[this.human.id];
      const enemyFlag = this.ctf[1 - this.human.id];
      if (myFlag && !myFlag.atBase) {
        info = '⚑ YOUR FLAG TAKEN — RECOVER IT!';
      } else if (enemyFlag && !enemyFlag.atBase) {
        info = '⚑ ENEMY FLAG CAPTURED — RETURN TO BASE!';
      }
    }
    if (selUnits.length === 1) {
      const u = selUnits[0];
      info = `${u.type.toUpperCase()}  HP:${u.hp}/${u.maxHp}`;
    } else if (selUnits.length > 1) {
      info = `${selUnits.length} UNITS SELECTED`;
    } else if (selBldg) {
      const queue = selBldg.trainQueue.length + (selBldg.trainCurrent ? 1 : 0);
      info = `${selBldg.type.toUpperCase()}  HP:${selBldg.hp}/${selBldg.maxHp}${queue > 0 ? `  Q:${queue}` : ''}`;
    }
    document.getElementById('sel-info').textContent = info;
  }

  _update(dt) {
    if (this.scene !== 'game' || this._gameOver) return;

    // Update players
    for (const p of this.players) {
      if (p instanceof CpuPlayer) {
        const enemies = this.players.filter(op => op.id !== p.id);
        p.aiUpdate(dt, enemies);
      }
      const trained = p.update(dt);
      for (const [unitType, building] of trained) {
        const gy = this.tilemap.getGroundY(building.x);
        const u = new Unit(unitType, building.x + (Math.random() - 0.5) * 20, gy, p.id);
        u.y = gy - u.height; // bottom of unit sits on ground surface
        p.units.push(u);
      }
    }

    // Update all units
    for (const p of this.players) {
      for (const u of p.units) {
        u.update(dt, this.tilemap);
      }
    }

    // CTF: flag pickup, drop-on-death, and capture
    if (this.ctf) {
      this._ctfUpdate();
    }

    // Mine proximity — check units walking into unexploded mines
    for (const mine of this.mines) {
      if (!mine.alive || mine.hasExploded) continue;
      const halfW = mine.width / 2;
      for (const p of this.players) {
        for (const u of p.units) {
          if (!u.alive) continue;
          const uHalfW = u.width / 2;
          const uBottom = u.y, uTop = u.y + u.height;
          const mLeft = mine.x - halfW, mRight = mine.x + halfW;
          const mBottom = mine.y, mTop = mine.y + mine.height;
          // AABB overlap check
          if (u.x + uHalfW > mLeft && u.x - uHalfW < mRight &&
              uBottom < mTop && uTop > mBottom) {
            // Unit triggered the mine — explode!
            mine.hasExploded = true;
            mine.alive = false;
            mine.tilemap && mine.tilemap.clearBuildingTiles(mine.tileX, mine.tileY, mine.wTiles, mine.hTiles);
            // Visual explosion projectile (large, centered on mine)
            this.combatSys.projectiles.push(new Projectile(mine.x, mine.centerY, 0, 0, -1, null, null));
            const lastP = this.combatSys.projectiles[this.combatSys.projectiles.length - 1];
            lastP.radius = 8;
            lastP.vx = 0; lastP.vy = 0; // stationary explosion visual
            lastP._angle = 0;
            lastP.alive = true;
            // Damage all units near the mine (2.5 tiles radius)
            const blastRadius = TILE_SIZE * 2.5;
            for (const op of this.players) {
              for (const other of op.units) {
                if (!other.alive) continue;
                const dx = other.x - mine.x, dy = other.centerY - mine.centerY;
                if (Math.sqrt(dx*dx + dy*dy) < blastRadius) {
                  other.takeDamage(MINE_DAMAGE);
                }
              }
            }
            break; // mine exploded, move to next mine
          }
        }
      }
    }

    // Combat
    this.combatSys.update(dt, this.players, this.tilemap);

    // Economy
    this.economySys.update(dt, this.players);

    // Camera
    this.camera.update(dt);
    window._fc_camX = this.camera.x;

    // Win check
    const alivePlayers = this.players.filter(p => p.alive);
    if (alivePlayers.length <= 1) {
      this._gameOver = true;
      setTimeout(() => this._showGameOver(alivePlayers[0] || null), 500);
    }

    this._updateHUD();
    this._tickMenuAffordability();
  }

  // CTF: pickup, drop-on-death, capture
  _ctfUpdate() {
    const CAPTURE_DIST = 80; // pixels — distance to own HQ to capture

    for (const carrierPlayer of this.players) {
      for (const u of carrierPlayer.units) {
        if (!u.alive || u.flagCarrying === null) continue;

        // Flag pickup: unit walks over enemy flag at base
        for (const flagPlayer of this.players) {
          if (flagPlayer.id === carrierPlayer.id) continue;
          const fs = this.ctf[flagPlayer.id];
          if (!fs.atBase) continue;
          if (!flagPlayer.hq || !flagPlayer.hq.alive) continue;

          // Check if unit is near the enemy HQ (flag location)
          const dx = Math.abs(u.x - flagPlayer.hq.x);
          const dy = Math.abs(u.centerY - flagPlayer.hq.y);
          if (dx < 60 && dy < 80) {
            // Pick up the flag!
            u.flagCarrying = flagPlayer.id;
            fs.atBase = false;
            fs.carrierId = u.id;
            // Flag carrier must return to their own HQ — clear attack orders, set move home
            u.target = null;
            u.moveTargetX = carrierPlayer.hq.x;
            u.state = 'moving';
          }
        }

        // Flag drop: carrier died — return flag to base
        if (!u.alive && u.flagCarrying !== null) {
          const fs = this.ctf[u.flagCarrying];
          if (fs) {
            fs.atBase = true;
            fs.carrierId = null;
          }
          u.flagCarrying = null;
          continue;
        }

        // Flag capture: carrier reached their own HQ
        if (carrierPlayer.hq && carrierPlayer.hq.alive) {
          const dx = Math.abs(u.x - carrierPlayer.hq.x);
          const dy = Math.abs(u.centerY - carrierPlayer.hq.y);
          if (dx < CAPTURE_DIST && dy < CAPTURE_DIST) {
            // Captured! The carrier's player wins
            this._gameOver = true;
            setTimeout(() => this._showGameOver(carrierPlayer), 300);
            return;
          }
        }
      }
    }
  }

  _render() {
    if (this.scene === 'menu') return;

    // Main canvas
    const ctx = this.ctx;
    ctx.save();
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);

    this.renderer.clear();
    this.renderer.drawTerrain(this.tilemap, this.camera.x);

    // Build preview ghost
    if (this.human && this.human.buildMode && this.camera) {
      const tx = this.human.buildPreviewTx;
      const ty = this.human.buildPreviewTy;
      const cfg = BUILDING_TYPES[this.human.buildMode];
      const valid = this.tilemap.canPlaceBuilding(tx, ty, cfg.width_tiles, cfg.height_tiles);
      this.renderer.drawBuildPreview(tx, ty, valid, this.human.buildMode, this.camera.x);
    }

    // Buildings
    for (const p of this.players) {
      for (const b of p.buildings) {
        if (!b.alive) continue;
        this.renderer.drawBuilding(b, this.camera.x, C.PLAYER);
      }
    }

    // Units
    for (const p of this.players) {
      for (const u of p.units) {
        if (!u.alive) continue;
        this.renderer.drawUnit(u, this.camera.x, C.PLAYER);
      }
    }

    // Projectiles
    for (const p of this.combatSys.projectiles) {
      if (p.alive) this.renderer.drawProjectile(p, this.camera.x);
    }

    // CTF flags
    if (this.ctf) {
      for (const p of this.players) {
        const fs = this.ctf[p.id];
        const flagCol = C.PLAYER[p.id % C.PLAYER.length];
        if (fs.atBase && p.hq && p.hq.alive) {
          // Flag behind the HQ — opposite side from the enemy's approach.
          // Player 0 is on the left, enemy approaches from the right → flag behind (left).
          // Player 1 is on the right, enemy approaches from the left → flag behind (right).
          const behindSign = p.id === 0 ? -1 : 1;
          const flagX = p.hq.x + behindSign * (p.hq.width / 2 + 16);
          const flagY = p.hq.y + p.hq.height;
          this.renderer.drawCtfFlag(flagX, flagY, flagCol, this.camera.x);
        }
        // Draw carried flag above carrier unit
        if (fs.carrierId !== null) {
          for (const op of this.players) {
            for (const u of op.units) {
              if (u.id === fs.carrierId && u.alive && u.flagCarrying !== null) {
                this.renderer.drawFlagCarrier(u, flagCol, this.camera.x);
              }
            }
          }
        }
      }
    }

    // Selection box (screen coordinates — draw before ctx.restore)
    if (this.selectionBox) {
      const { sx1, sy1, sx2, sy2 } = this.selectionBox;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0); // screen space
      ctx.fillStyle = 'rgba(50,120,255,0.18)';
      ctx.fillRect(sx1, sy1, sx2 - sx1, sy2 - sy1);
      ctx.strokeStyle = 'rgba(50,120,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(sx1 + 0.75, sy1 + 0.75, sx2 - sx1 - 1.5, sy2 - sy1 - 1.5);
      ctx.restore();
    }

    ctx.restore();

    // Minimap
    if (this.minimap) {
      this.minimap.render(this.camera.x, this.players);
    }
  }

  _loop(timestamp) {
    const dt = Math.min((timestamp - this._lastTime) / 1000, 0.25);
    this._lastTime = timestamp;
    this._update(dt);
    this._render();
    requestAnimationFrame(t => this._loop(t));
  }

  cancelBuildMode() {
    if (this.human) this.human.cancelBuildMode();
  }
}

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  document.getElementById('game-version-num').textContent = GAME_VERSION;
  window._fc = new FortressCommand();
});
</script>
